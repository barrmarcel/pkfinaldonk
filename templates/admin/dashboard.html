{% extends "layout.html" %}

{% block content %}
<div class="row">
    <div class="col-12 mb-4">
        <h2>Database Tables Overview</h2>
        <p class="text-muted">Select a table to view and manage its contents.</p>
    </div>
    
    {% for table in table_stats %}
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm h-100 border-0 border-top border-primary border-4">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title text-capitalize">{{ table.name }}</h5>
                <p class="card-text text-muted fs-4 mb-4">
                    <i class="bi bi-table me-2"></i> {{ table.count }} Rows
                </p>
                <a href="{{ url_for('admin.view_table', table=table.name) }}" class="btn btn-outline-primary mt-auto">View Data &rarr;</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
